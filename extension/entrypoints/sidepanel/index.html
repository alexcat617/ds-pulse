<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DS Pulse</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="header__title">DS Pulse</h1>
      <p class="header__subtitle">Apex UI compliance</p>
    </header>

    <section class="score" aria-live="polite">
      <p class="score__label">Compliance</p>
      <p class="score__value" id="compliance">--%</p>
    </section>

    <div class="actions">
      <button type="button" class="btn btn--primary" id="scan-btn">
        Scan Current Page
      </button>
    </div>

    <p class="meta" id="meta">Ready.</p>

    <ul class="violations" id="violations" aria-label="Violations"></ul>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
